<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Spud Survivor - Hardcore Arena Edition</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #161625;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
      user-select: none;
    }
    #hud {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }
    .bar-container {
      width: 220px;
      height: 18px;
      background: #2b2d42;
      border: 2px solid #fff;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 4px;
      margin-bottom: 8px;
    }
    #hp-bar {
      width: 100%;
      height: 100%;
      background: #e63946;
      transition: width 0.1s;
    }
    #xp-bar {
      width: 0%;
      height: 100%;
      background: #4cc9f0;
      transition: width 0.1s;
    }
    #wave-timer {
      font-size: 36px;
      color: #ffd166;
    }
    #boss-hud {
      position: absolute;
      top: 85px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
    }
    #boss-name {
      color: #ff006e;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    #boss-bar-container {
      width: 380px;
      height: 22px;
      background: #1a1a2e;
      border: 2px solid #ff006e;
      border-radius: 8px;
      overflow: hidden;
    }
    #boss-bar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff006e, #ffbe0b);
      transition: width 0.1s;
    }
    .overlay-screen {
      position: absolute;
      inset: 0;
      background: rgba(12, 12, 22, 0.92);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    h1 { margin-bottom: 8px; color: #ffd166; font-size: 36px; }
    .card-grid {
      display: flex;
      gap: 20px;
      margin: 25px 0;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 900px;
    }
    .card {
      background: #2b2d42;
      border: 2px solid #8d99ae;
      border-radius: 10px;
      padding: 20px;
      width: 190px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s, opacity 0.15s;
    }
    .card:hover:not(.disabled) {
      transform: translateY(-6px);
      border-color: #06d6a0;
    }
    .card.disabled {
      opacity: 0.45;
      cursor: not-allowed;
      border-color: #555;
    }
    .card h3 { margin: 0 0 10px 0; color: #06d6a0; font-size: 20px; }
    .card p { font-size: 14px; color: #edf2f4; line-height: 1.4; }
    .cost { font-weight: bold; color: #ffd166; margin-top: 12px; font-size: 16px; }
    button {
      padding: 14px 32px;
      font-size: 18px;
      font-weight: bold;
      background: #06d6a0;
      color: #161625;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #05b384; }
  </style>
</head>
<body>

  <div id="hud">
    <div>
      <div>HP: <span id="hp-text">85/85</span> | Armor: <span id="armor-text" style="color:#adb5bd;">0</span></div>
      <div class="bar-container"><div id="hp-bar"></div></div>

      <div>LEVEL <span id="lvl-text" style="color:#4cc9f0;">1</span> (<span id="xp-text">0/25</span> XP)</div>
      <div class="bar-container"><div id="xp-bar"></div></div>

      <div style="color: #06d6a0;">Materials: <span id="mat-text">0</span></div>
    </div>

    <div style="text-align: center;">
      <div>WAVE <span id="wave-num">1</span></div>
      <div id="wave-timer">25</div>
    </div>

    <div style="text-align: right;">
      <div>Weapons: <span id="weapon-count">1</span>/6</div>
      <div>Enemies Alive: <span id="enemy-count" style="color:#e63946;">0</span></div>
      <div>Total Kills: <span id="kill-count">0</span></div>
    </div>
  </div>

  <!-- BOSS HEALTH BAR -->
  <div id="boss-hud">
    <div id="boss-name">OVERLORD SPUD CRUSHER</div>
    <div id="boss-bar-container"><div id="boss-bar"></div></div>
  </div>

  <!-- LEVEL UP SCREEN -->
  <div id="levelup-screen" class="overlay-screen">
    <h1 style="color: #4cc9f0;">LEVEL UP!</h1>
    <p>Choose a minor stat boost:</p>
    <div class="card-grid" id="levelup-choices"></div>
  </div>

  <!-- END OF WAVE SHOP -->
  <div id="shop-screen" class="overlay-screen">
    <h1>WAVE SURVIVED!</h1>
    <p>Materials Available: <span id="shop-mat" style="color:#06d6a0; font-weight:bold;">0</span></p>
    <div class="card-grid" id="shop-items"></div>
    <button id="next-wave-btn">START WAVE <span id="next-wave-num">2</span></button>
  </div>

  <!-- GAME OVER -->
  <div id="gameover-screen" class="overlay-screen">
    <h1 style="color: #e63946;">YOU GOT OBLITERATED!</h1>
    <p id="final-stats" style="font-size: 22px; margin-bottom: 24px;"></p>
    <button onclick="location.reload()">TRY AGAIN</button>
  </div>

  <script>
    // Self-contained procedural 3D WebGL renderer & math engine (zero external dependencies)
    const canvas = document.createElement('canvas');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    canvas.style.display = 'block';
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d');

    const state = {
      hp: 85,
      maxHp: 85,
      armor: 0,
      hpRegen: 0.35,
      speed: 14.5,
      damage: 15,
      fireRate: 0.44,
      pickupRange: 6.5,
      weapons: 1,
      level: 1,
      xp: 0,
      xpToNext: 25,
      materials: 0,
      kills: 0,
      wave: 1,
      timeLeft: 25,
      paused: false,
      gameOver: false,
      lastShot: 0,
      bossSpawnedThisWave: false
    };

    const ARENA_SIZE = 34;
    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // Player & Camera
    const player = { x: 0, z: 0, angle: 0, radius: 1.1 };
    const cam = { x: 0, z: 24, height: 34, pitch: 0.88 };

    // 3D Arena Obstacles (Cover pillars & boulders with collision)
    const obstacles = [
      { x: -14, z: -14, r: 2.3, h: 3.4, color: '#4a4e69', top: '#6c757d', type: 'pillar' },
      { x:  14, z: -14, r: 2.3, h: 3.4, color: '#4a4e69', top: '#6c757d', type: 'pillar' },
      { x: -14, z:  14, r: 2.3, h: 3.4, color: '#4a4e69', top: '#6c757d', type: 'pillar' },
      { x:  14, z:  14, r: 2.3, h: 3.4, color: '#4a4e69', top: '#6c757d', type: 'pillar' },
      { x:   0, z: -19, r: 1.8, h: 2.0, color: '#5c5470', top: '#7f7894', type: 'rock' },
      { x:   0, z:  19, r: 1.8, h: 2.0, color: '#5c5470', top: '#7f7894', type: 'rock' },
      { x: -20, z:   0, r: 1.8, h: 2.0, color: '#5c5470', top: '#7f7894', type: 'rock' },
      { x:  20, z:   0, r: 1.8, h: 2.0, color: '#5c5470', top: '#7f7894', type: 'rock' }
    ];

    // Floor decorative patches
    const floorPatches = [];
    for (let i = 0; i < 45; i++) {
      floorPatches.push({
        x: (Math.random() - 0.5) * (ARENA_SIZE * 1.8),
        z: (Math.random() - 0.5) * (ARENA_SIZE * 1.8),
        r: 1.2 + Math.random() * 2.5,
        color: i % 2 === 0 ? '#1f1f33' : '#2a2a42'
      });
    }

    const enemies = [];
    const bullets = [];
    const enemyBullets = [];
    const gems = [];
    const particles = [];

    // NERFED LEVEL UP POOL
    const levelUpPool = [
      { title: "Sharpened Peel", desc: "+1 Damage", apply: () => { state.damage += 1; } },
      { title: "Thick Skin", desc: "+4 Max HP", apply: () => { state.maxHp += 4; state.hp = Math.min(state.maxHp, state.hp + 4); } },
      { title: "Iron Spud", desc: "+1 Armor", apply: () => { state.armor += 1; } },
      { title: "Quick Trigger", desc: "+2% Attack Speed", apply: () => { state.fireRate = Math.max(0.14, state.fireRate * 0.98); } },
      { title: "Light Steps", desc: "+4% Move Speed", apply: () => { state.speed *= 1.04; } },
      { title: "Starch Patch", desc: "+0.15 HP/s Regen", apply: () => { state.hpRegen += 0.15; } },
      { title: "Static Pull", desc: "+0.4 Pickup Range", apply: () => { state.pickupRange += 0.4; } }
    ];

    function triggerLevelUp() {
      state.paused = true;
      const screen = document.getElementById('levelup-screen');
      const container = document.getElementById('levelup-choices');
      container.innerHTML = '';

      const shuffled = [...levelUpPool].sort(() => 0.5 - Math.random()).slice(0, 3);
      shuffled.forEach(opt => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<h3>${opt.title}</h3><p>${opt.desc}</p>`;
        card.onclick = () => {
          opt.apply();
          updateHUD();
          screen.style.display = 'none';
          state.paused = false;
          lastTime = performance.now();
          requestAnimationFrame(animate);
        };
        container.appendChild(card);
      });
      screen.style.display = 'flex';
    }

    // EXPENSIVE SHOP CATALOG (High base prices + 1.5x scaling)
    const shopCatalog = [
      {
        title: "Extra Spud Blaster",
        desc: "Add +1 orbiting weapon (Max 6)",
        cost: 115,
        maxed: () => state.weapons >= 6,
        buy: () => { state.weapons++; }
      },
      {
        title: "Heavy Barrel",
        desc: "+4 Damage to all weapons",
        cost: 55,
        maxed: () => false,
        buy: () => { state.damage += 4; }
      },
      {
        title: "Plated Armor",
        desc: "+2 Armor (reduces hit damage)",
        cost: 60,
        maxed: () => false,
        buy: () => { state.armor += 2; }
      },
      {
        title: "Overclocked Spring",
        desc: "+10% Attack Speed",
        cost: 65,
        maxed: () => state.fireRate <= 0.14,
        buy: () => { state.fireRate = Math.max(0.14, state.fireRate * 0.90); }
      },
      {
        title: "Reinforced Tubers",
        desc: "+18 Max HP & heal 18 HP",
        cost: 45,
        maxed: () => false,
        buy: () => { state.maxHp += 18; state.hp = Math.min(state.maxHp, state.hp + 18); }
      },
      {
        title: "Emergency Mash",
        desc: "Restore 35 HP immediately",
        cost: 40,
        maxed: () => state.hp >= state.maxHp,
        buy: () => { state.hp = Math.min(state.maxHp, state.hp + 35); }
      }
    ];

    function renderShop() {
      document.getElementById('shop-mat').innerText = state.materials;
      const container = document.getElementById('shop-items');
      container.innerHTML = '';

      shopCatalog.forEach(item => {
        const isMaxed = item.maxed();
        const canAfford = state.materials >= item.cost && !isMaxed;

        const card = document.createElement('div');
        card.className = 'card' + (canAfford ? '' : ' disabled');
        card.innerHTML = `
          <h3>${item.title}</h3>
          <p>${item.desc}</p>
          <div class="cost">${isMaxed ? 'MAXED' : `Cost: ${item.cost} Materials`}</div>
        `;

        if (canAfford) {
          card.onclick = () => {
            state.materials -= item.cost;
            item.buy();
            item.cost = Math.ceil(item.cost * 1.5);
            updateHUD();
            renderShop();
          };
        }
        container.appendChild(card);
      });
    }

    function openShop() {
      state.paused = true;
      enemies.length = 0;
      bullets.length = 0;
      enemyBullets.length = 0;
      document.getElementById('boss-hud').style.display = 'none';
      document.getElementById('next-wave-num').innerText = state.wave + 1;
      renderShop();
      document.getElementById('shop-screen').style.display = 'flex';
    }

    document.getElementById('next-wave-btn').onclick = () => {
      state.wave++;
      state.timeLeft = 25 + Math.min(15, state.wave * 2);
      state.bossSpawnedThisWave = false;
      document.getElementById('shop-screen').style.display = 'none';
      state.paused = false;
      updateHUD();
      lastTime = performance.now();
      requestAnimationFrame(animate);
    };

    function spawnHordeCluster() {
      const clusterSize = Math.min(8, 2 + Math.floor(state.wave * 0.85));
      const side = Math.floor(Math.random() * 4);
      const bound = ARENA_SIZE - 2.0;

      let baseX = 0, baseZ = 0;
      if (side === 0) { baseX = (Math.random() - 0.5) * bound * 2; baseZ = -bound; }
      else if (side === 1) { baseX = (Math.random() - 0.5) * bound * 2; baseZ = bound; }
      else if (side === 2) { baseX = -bound; baseZ = (Math.random() - 0.5) * bound * 2; }
      else { baseX = bound; baseZ = (Math.random() - 0.5) * bound * 2; }

      for (let i = 0; i < clusterSize; i++) {
        const roll = Math.random();
        let type = 'swarmer', color = '#e63946', topColor = '#ff758f';
        let hp = 18 + state.wave * 5, speed = 5.4, damage = 9, radius = 0.85, height = 1.3, val = 1;

        if (state.wave >= 2 && roll < 0.25) {
          type = 'fast'; color = '#f77f00'; topColor = '#fcbf49';
          hp = 12 + state.wave * 3; speed = 9.0; damage = 7; radius = 0.7; height = 1.4; val = 1;
        } else if (state.wave >= 3 && roll < 0.42) {
          type = 'ranged'; color = '#00bbf9'; topColor = '#90e0ef';
          hp = 22 + state.wave * 5; speed = 4.2; damage = 9; radius = 0.95; height = 1.6; val = 2;
        } else if (state.wave >= 4 && roll < 0.55) {
          type = 'tank'; color = '#9b5de5'; topColor = '#c77dff';
          hp = 75 + state.wave * 18; speed = 3.2; damage = 16; radius = 1.45; height = 2.3; val = 3;
        }

        enemies.push({
          type,
          x: Math.max(-bound, Math.min(bound, baseX + (Math.random() - 0.5) * 4)),
          z: Math.max(-bound, Math.min(bound, baseZ + (Math.random() - 0.5) * 4)),
          hp,
          maxHp: hp,
          speed,
          damage,
          radius,
          height,
          color,
          topColor,
          val,
          shootTimer: Math.random() * 1.5,
          isBoss: false
        });
      }
    }

    function spawnBoss() {
      const bossHp = 350 + state.wave * 140;
      enemies.push({
        type: 'boss',
        x: 0,
        z: -ARENA_SIZE + 3.5,
        hp: bossHp,
        maxHp: bossHp,
        speed: 4.0,
        damage: 22,
        radius: 2.3,
        height: 3.4,
        color: '#ff006e',
        topColor: '#ffbe0b',
        val: 20,
        shootTimer: 0,
        isBoss: true
      });
      const bossHud = document.getElementById('boss-hud');
      bossHud.style.display = 'flex';
      document.getElementById('boss-bar').style.width = '100%';
    }

    function getWeaponPositions() {
      const list = [];
      for (let i = 0; i < state.weapons; i++) {
        const angle = (i / state.weapons) * Math.PI * 2 + performance.now() * 0.002;
        list.push({
          x: player.x + Math.cos(angle) * 2.1,
          z: player.z + Math.sin(angle) * 2.1,
          angle
        });
      }
      return list;
    }

    function shootPlayerWeapons() {
      if (enemies.length === 0) return;
      const wList = getWeaponPositions();
      wList.forEach(w => {
        let nearest = null, minDist = 26;
        for (let i = 0; i < enemies.length; i++) {
          const d = Math.hypot(enemies[i].x - w.x, enemies[i].z - w.z);
          if (d < minDist) {
            minDist = d;
            nearest = enemies[i];
          }
        }
        if (nearest) {
          const dx = nearest.x - w.x;
          const dz = nearest.z - w.z;
          const len = Math.hypot(dx, dz) || 1;
          bullets.push({
            x: w.x,
            z: w.z,
            vx: (dx / len) * 38,
            vz: (dz / len) * 38,
            life: 1.3
          });
        }
      });
    }

    function shootEnemyBullet(fromX, fromZ, toX, toZ, speed = 17) {
      const dx = toX - fromX;
      const dz = toZ - fromZ;
      const len = Math.hypot(dx, dz) || 1;
      enemyBullets.push({
        x: fromX,
        z: fromZ,
        vx: (dx / len) * speed,
        vz: (dz / len) * speed,
        life: 2.6
      });
    }

    function spawnParticles(x, z, color, count = 6) {
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 3 + Math.random() * 8;
        particles.push({
          x, z, y: 1.0,
          vx: Math.cos(ang) * spd,
          vz: Math.sin(ang) * spd,
          vy: 3 + Math.random() * 4,
          color,
          life: 0.45
        });
      }
    }

    function resolveObstacleCollision(entity) {
      for (let i = 0; i < obstacles.length; i++) {
        const obs = obstacles[i];
        const dx = entity.x - obs.x;
        const dz = entity.z - obs.z;
        const dist = Math.hypot(dx, dz);
        const minDist = entity.radius + obs.r;
        if (dist < minDist) {
          const nx = dist > 0.001 ? dx / dist : 1;
          const nz = dist > 0.001 ? dz / dist : 0;
          entity.x = obs.x + nx * minDist;
          entity.z = obs.z + nz * minDist;
        }
      }
    }

    function updateHUD() {
      document.getElementById('hp-text').innerText = `${Math.ceil(state.hp)}/${state.maxHp}`;
      document.getElementById('armor-text').innerText = state.armor;
      document.getElementById('hp-bar').style.width = `${Math.max(0, (state.hp / state.maxHp) * 100)}%`;
      document.getElementById('lvl-text').innerText = state.level;
      document.getElementById('xp-text').innerText = `${state.xp}/${state.xpToNext}`;
      document.getElementById('xp-bar').style.width = `${Math.min(100, (state.xp / state.xpToNext) * 100)}%`;
      document.getElementById('mat-text').innerText = state.materials;
      document.getElementById('wave-num').innerText = state.wave;
      document.getElementById('wave-timer').innerText = Math.ceil(state.timeLeft);
      document.getElementById('weapon-count').innerText = state.weapons;
      document.getElementById('enemy-count').innerText = enemies.length;
      document.getElementById('kill-count').innerText = state.kills;
    }

    // 3D Perspective Projection Helper
    function project(wx, wy, wz) {
      const rx = wx - cam.x;
      const ry = wy - cam.height;
      const rz = wz - cam.z;

      const cosP = Math.cos(cam.pitch);
      const sinP = Math.sin(cam.pitch);

      const cy = ry * cosP - rz * sinP;
      const cz = ry * sinP + rz * cosP;

      if (cz <= 0.5) return null;
      const fov = Math.min(canvas.width, canvas.height) * 0.95;
      const scale = fov / cz;
      return {
        sx: canvas.width * 0.5 + rx * scale,
        sy: canvas.height * 0.5 - cy * scale,
        scale,
        depth: cz
      };
    }

    function draw3DCylinder(x, z, r, h, sideColor, topColor) {
      const bot = project(x, 0, z);
      const top = project(x, h, z);
      if (!bot || !top) return;

      const rx = r * bot.scale;
      const ry = rx * 0.58;
      const trx = r * top.scale;
      const try_ = trx * 0.58;

      // Shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
      ctx.beginPath();
      ctx.ellipse(bot.sx + 4, bot.sy + 4, rx * 1.1, ry * 1.1, 0, 0, Math.PI * 2);
      ctx.fill();

      // Side body
      ctx.fillStyle = sideColor;
      ctx.beginPath();
      ctx.ellipse(bot.sx, bot.sy, rx, ry, 0, 0, Math.PI);
      ctx.lineTo(top.sx - trx, top.sy);
      ctx.ellipse(top.sx, top.sy, trx, try_, 0, Math.PI, 0, true);
      ctx.closePath();
      ctx.fill();

      // Top cap
      ctx.fillStyle = topColor;
      ctx.beginPath();
      ctx.ellipse(top.sx, top.sy, trx, try_, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function renderScene() {
      ctx.fillStyle = '#12121e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Arena Floor Quad
      const c1 = project(-ARENA_SIZE, 0, -ARENA_SIZE);
      const c2 = project( ARENA_SIZE, 0, -ARENA_SIZE);
      const c3 = project( ARENA_SIZE, 0,  ARENA_SIZE);
      const c4 = project(-ARENA_SIZE, 0,  ARENA_SIZE);

      if (c1 && c2 && c3 && c4) {
        ctx.fillStyle = '#252538';
        ctx.beginPath();
        ctx.moveTo(c1.sx, c1.sy);
        ctx.lineTo(c2.sx, c2.sy);
        ctx.lineTo(c3.sx, c3.sy);
        ctx.lineTo(c4.sx, c4.sy);
        ctx.closePath();
        ctx.fill();

        // Decorative ground patches
        for (let i = 0; i < floorPatches.length; i++) {
          const fp = floorPatches[i];
          const p = project(fp.x, 0, fp.z);
          if (p) {
            ctx.fillStyle = fp.color;
            ctx.beginPath();
            ctx.ellipse(p.sx, p.sy, fp.r * p.scale, fp.r * p.scale * 0.58, 0, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // Arena Grid Lines
        ctx.strokeStyle = 'rgba(100, 110, 150, 0.22)';
        ctx.lineWidth = 1;
        const step = 4;
        for (let g = -ARENA_SIZE; g <= ARENA_SIZE; g += step) {
          const a = project(g, 0, -ARENA_SIZE);
          const b = project(g, 0,  ARENA_SIZE);
          if (a && b) { ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.stroke(); }

          const d = project(-ARENA_SIZE, 0, g);
          const e = project( ARENA_SIZE, 0, g);
          if (d && e) { ctx.beginPath(); ctx.moveTo(d.sx, d.sy); ctx.lineTo(e.sx, e.sy); ctx.stroke(); }
        }
      }

      // Perimeter Arena Walls
      const wallH = 2.6;
      const wallSegments = [
        { x1: -ARENA_SIZE, z1: -ARENA_SIZE, x2:  ARENA_SIZE, z2: -ARENA_SIZE, col: '#3a3d5c' },
        { x1: -ARENA_SIZE, z1: -ARENA_SIZE, x2: -ARENA_SIZE, z2:  ARENA_SIZE, col: '#2f324c' },
        { x1:  ARENA_SIZE, z1: -ARENA_SIZE, x2:  ARENA_SIZE, z2:  ARENA_SIZE, col: '#2f324c' },
        { x1: -ARENA_SIZE, z1:  ARENA_SIZE, x2:  ARENA_SIZE, z2:  ARENA_SIZE, col: '#484c70' }
      ];

      wallSegments.forEach(w => {
        const b1 = project(w.x1, 0, w.z1);
        const b2 = project(w.x2, 0, w.z2);
        const t1 = project(w.x1, wallH, w.z1);
        const t2 = project(w.x2, wallH, w.z2);
        if (b1 && b2 && t1 && t2) {
          ctx.fillStyle = w.col;
          ctx.beginPath();
          ctx.moveTo(b1.sx, b1.sy);
          ctx.lineTo(b2.sx, b2.sy);
          ctx.lineTo(t2.sx, t2.sy);
          ctx.lineTo(t1.sx, t1.sy);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = '#6c757d';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      });

      // Four Corner Watchtowers with Glowing Beacons
      const corners = [
        [-ARENA_SIZE, -ARENA_SIZE],
        [ ARENA_SIZE, -ARENA_SIZE],
        [-ARENA_SIZE,  ARENA_SIZE],
        [ ARENA_SIZE,  ARENA_SIZE]
      ];
      corners.forEach(([cx, cz]) => {
        draw3DCylinder(cx, cz, 2.2, 4.8, '#343a40', '#495057');
        draw3DCylinder(cx, cz, 0.9, 5.6, '#06d6a0', '#80ffdb');
      });

      // Depth-sorted render list for all 3D entities
      const renderables = [];

      obstacles.forEach(obs => {
        renderables.push({
          z: obs.z,
          draw: () => draw3DCylinder(obs.x, obs.z, obs.r, obs.h, obs.color, obs.top)
        });
      });

      gems.forEach(g => {
        renderables.push({
          z: g.z,
          draw: () => {
            const bob = 0.6 + Math.sin(performance.now() * 0.006 + g.x) * 0.2;
            const p = project(g.x, bob, g.z);
            if (!p) return;
            const r = 0.45 * p.scale;
            ctx.fillStyle = '#06d6a0';
            ctx.beginPath();
            ctx.moveTo(p.sx, p.sy - r * 1.3);
            ctx.lineTo(p.sx + r, p.sy);
            ctx.lineTo(p.sx, p.sy + r * 1.3);
            ctx.lineTo(p.sx - r, p.sy);
            ctx.closePath();
            ctx.fill();
          }
        });
      });

      enemies.forEach(e => {
        renderables.push({
          z: e.z,
          draw: () => {
            draw3DCylinder(e.x, e.z, e.radius, e.height, e.color, e.topColor);
            // Mini HP bar above damaged non-boss enemies
            if (!e.isBoss && e.hp < e.maxHp) {
              const top = project(e.x, e.height + 0.6, e.z);
              if (top) {
                const bw = 28;
                ctx.fillStyle = '#111';
                ctx.fillRect(top.sx - bw / 2, top.sy, bw, 4);
                ctx.fillStyle = '#e63946';
                ctx.fillRect(top.sx - bw / 2, top.sy, bw * Math.max(0, e.hp / e.maxHp), 4);
              }
            }
          }
        });
      });

      // Player Spud + Eyes + Orbiting Weapons
      renderables.push({
        z: player.z,
        draw: () => {
          draw3DCylinder(player.x, player.z, player.radius, 2.2, '#b07d4f', '#d4a373');
          const head = project(player.x, 1.85, player.z);
          if (head) {
            const eyeOffX = Math.sin(player.angle) * 0.55 * head.scale;
            const eyeOffY = Math.cos(player.angle) * 0.35 * head.scale;
            const spread = 0.32 * head.scale;
            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.arc(head.sx + eyeOffX - spread, head.sy + eyeOffY, 0.16 * head.scale, 0, Math.PI * 2);
            ctx.arc(head.sx + eyeOffX + spread, head.sy + eyeOffY, 0.16 * head.scale, 0, Math.PI * 2);
            ctx.fill();
          }
          getWeaponPositions().forEach(w => {
            draw3DCylinder(w.x, w.z, 0.35, 1.35, '#6c757d', '#ced4da');
          });
        }
      });

      bullets.forEach(b => {
        renderables.push({
          z: b.z,
          draw: () => {
            const p = project(b.x, 1.2, b.z);
            if (!p) return;
            ctx.fillStyle = '#ffd166';
            ctx.beginPath();
            ctx.arc(p.sx, p.sy, 0.32 * p.scale, 0, Math.PI * 2);
            ctx.fill();
          }
        });
      });

      enemyBullets.forEach(eb => {
        renderables.push({
          z: eb.z,
          draw: () => {
            const p = project(eb.x, 1.2, eb.z);
            if (!p) return;
            ctx.fillStyle = '#ff006e';
            ctx.beginPath();
            ctx.arc(p.sx, p.sy, 0.36 * p.scale, 0, Math.PI * 2);
            ctx.fill();
          }
        });
      });

      particles.forEach(pt => {
        renderables.push({
          z: pt.z,
          draw: () => {
            const p = project(pt.x, pt.y, pt.z);
            if (!p) return;
            ctx.fillStyle = pt.color;
            ctx.beginPath();
            ctx.arc(p.sx, p.sy, 0.22 * p.scale, 0, Math.PI * 2);
            ctx.fill();
          }
        });
      });

      renderables.sort((a, b) => a.z - b.z);
      for (let i = 0; i < renderables.length; i++) {
        renderables[i].draw();
      }
    }

    let lastTime = performance.now();
    let spawnTimer = 0;

    function animate(now) {
      if (state.gameOver || state.paused) return;
      requestAnimationFrame(animate);

      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;

      // Wave Timer
      state.timeLeft -= dt;
      if (state.timeLeft <= 0) {
        state.timeLeft = 0;
        updateHUD();
        openShop();
        return;
      }

      // Spawn Boss every 3 waves halfway through the wave
      if (state.wave % 3 === 0 && !state.bossSpawnedThisWave && state.timeLeft <= 18) {
        state.bossSpawnedThisWave = true;
        spawnBoss();
      }

      // Passive HP Regen
      if (state.hp < state.maxHp) {
        state.hp = Math.min(state.maxHp, state.hp + state.hpRegen * dt);
      }

      // Player Movement
      let moveX = 0, moveZ = 0;
      if (keys['KeyW'] || keys['ArrowUp']) moveZ -= 1;
      if (keys['KeyS'] || keys['ArrowDown']) moveZ += 1;
      if (keys['KeyA'] || keys['ArrowLeft']) moveX -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;

      if (moveX !== 0 || moveZ !== 0) {
        const len = Math.hypot(moveX, moveZ);
        moveX /= len;
        moveZ /= len;
        player.x += moveX * state.speed * dt;
        player.z += moveZ * state.speed * dt;
        player.angle = Math.atan2(moveX, moveZ);
        resolveObstacleCollision(player);
        player.x = Math.max(-ARENA_SIZE + 1.5, Math.min(ARENA_SIZE - 1.5, player.x));
        player.z = Math.max(-ARENA_SIZE + 1.5, Math.min(ARENA_SIZE - 1.5, player.z));
      }

      // Smooth Camera Follow
      cam.x += (player.x - cam.x) * 0.12;
      cam.z += (player.z + 24 - cam.z) * 0.12;

      // Enemy Spawning
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnHordeCluster();
        spawnTimer = Math.max(0.85, 2.5 - state.wave * 0.16);
      }

      // Auto-Fire Weapons
      if (now / 1000 - state.lastShot >= state.fireRate) {
        shootPlayerWeapons();
        state.lastShot = now / 1000;
      }

      // Update Player Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx * dt;
        b.z += b.vz * dt;
        b.life -= dt;

        // Check obstacle collision
        let blocked = false;
        for (let k = 0; k < obstacles.length; k++) {
          if (Math.hypot(b.x - obstacles[k].x, b.z - obstacles[k].z) < obstacles[k].r) {
            blocked = true;
            break;
          }
        }

        let hit = false;
        if (!blocked) {
          for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            if (Math.hypot(b.x - e.x, b.z - e.z) < e.radius + 0.35) {
              e.hp -= state.damage;
              hit = true;
              spawnParticles(b.x, b.z, '#ffd166', 3);

              if (e.isBoss) {
                document.getElementById('boss-bar').style.width = `${Math.max(0, (e.hp / e.maxHp) * 100)}%`;
              }

              if (e.hp <= 0) {
                spawnParticles(e.x, e.z, e.color, e.isBoss ? 22 : 8);
                gems.push({ x: e.x, z: e.z, val: e.val });
                if (e.isBoss) {
                  document.getElementById('boss-hud').style.display = 'none';
                }
                enemies.splice(j, 1);
                state.kills++;
              }
              break;
            }
          }
        }

        if (blocked || hit || b.life <= 0) {
          bullets.splice(i, 1);
        }
      }

      // Update Enemy Bullets
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        eb.x += eb.vx * dt;
        eb.z += eb.vz * dt;
        eb.life -= dt;

        let blocked = false;
        for (let k = 0; k < obstacles.length; k++) {
          if (Math.hypot(eb.x - obstacles[k].x, eb.z - obstacles[k].z) < obstacles[k].r) {
            blocked = true;
            break;
          }
        }

        if (!blocked && Math.hypot(eb.x - player.x, eb.z - player.z) < player.radius + 0.25) {
          const dmgTaken = Math.max(3, 13 - state.armor);
          state.hp -= dmgTaken;
          spawnParticles(player.x, player.z, '#e63946', 5);
          enemyBullets.splice(i, 1);
          checkGameOver();
          continue;
        }

        if (blocked || eb.life <= 0) {
          enemyBullets.splice(i, 1);
        }
      }

      // Update Enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const dx = player.x - e.x;
        const dz = player.z - e.z;
        const distToPlayer = Math.hypot(dx, dz) || 1;

        if (e.type === 'ranged' && distToPlayer < 15) {
          e.shootTimer += dt;
          if (e.shootTimer >= 2.2) {
            e.shootTimer = 0;
            shootEnemyBullet(e.x, e.z, player.x, player.z, 16);
          }
        } else if (e.isBoss) {
          e.x += (dx / distToPlayer) * e.speed * dt;
          e.z += (dz / distToPlayer) * e.speed * dt;
          e.shootTimer += dt;
          if (e.shootTimer >= 2.6) {
            e.shootTimer = 0;
            // Boss radial 6-shot burst
            for (let a = 0; a < 6; a++) {
              const ang = (a / 6) * Math.PI * 2;
              shootEnemyBullet(e.x, e.z, e.x + Math.cos(ang) * 10, e.z + Math.sin(ang) * 10, 14);
            }
          }
        } else {
          e.x += (dx / distToPlayer) * e.speed * dt;
          e.z += (dz / distToPlayer) * e.speed * dt;
        }

        // Enemy-to-enemy soft separation
        for (let j = i - 1; j >= Math.max(0, i - 10); j--) {
          const other = enemies[j];
          const sdx = e.x - other.x;
          const sdz = e.z - other.z;
          const dSq = sdx * sdx + sdz * sdz;
          const minSep = e.radius + other.radius;
          if (dSq > 0.001 && dSq < minSep * minSep) {
            const push = 2.2 * dt;
            e.x += sdx * push;
            e.z += sdz * push;
          }
        }

        resolveObstacleCollision(e);

        if (distToPlayer < e.radius + player.radius) {
          const mitigation = Math.max(0.35, 1 - state.armor * 0.06);
          state.hp -= e.damage * mitigation * dt * 2.1;
          checkGameOver();
        }
      }

      // Update Gems
      for (let i = gems.length - 1; i >= 0; i--) {
        const g = gems[i];
        const dx = player.x - g.x;
        const dz = player.z - g.z;
        const dist = Math.hypot(dx, dz) || 1;

        if (dist < state.pickupRange) {
          g.x += (dx / dist) * 20 * dt;
          g.z += (dz / dist) * 20 * dt;
        }

        if (dist < 1.5) {
          state.materials += g.val;
          state.xp += g.val;
          gems.splice(i, 1);

          if (state.xp >= state.xpToNext) {
            state.xp -= state.xpToNext;
            state.level++;
            state.xpToNext = Math.floor(state.xpToNext * 1.45);
            updateHUD();
            triggerLevelUp();
            return;
          }
        }
      }

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx * dt;
        pt.z += pt.vz * dt;
        pt.y += pt.vy * dt;
        pt.vy -= 14 * dt;
        pt.life -= dt;
        if (pt.life <= 0) particles.splice(i, 1);
      }

      updateHUD();
      renderScene();
    }

    function checkGameOver() {
      if (state.hp <= 0 && !state.gameOver) {
        state.hp = 0;
        state.gameOver = true;
        updateHUD();
        document.getElementById('gameover-screen').style.display = 'flex';
        document.getElementById('final-stats').innerText = `Level ${state.level} | Wave ${state.wave} | Total Kills: ${state.kills}`;
      }
    }

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    updateHUD();
    animate(performance.now());
  </script>
</body>
</html>
