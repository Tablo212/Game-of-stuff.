<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Spud Survivor - Hardcore Economy Edition</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #161625;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
      user-select: none;
    }
    #hud {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }
    .bar-container {
      width: 220px;
      height: 18px;
      background: #2b2d42;
      border: 2px solid #fff;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 4px;
      margin-bottom: 8px;
    }
    #hp-bar {
      width: 100%;
      height: 100%;
      background: #e63946;
      transition: width 0.1s;
    }
    #xp-bar {
      width: 0%;
      height: 100%;
      background: #4cc9f0;
      transition: width 0.1s;
    }
    #wave-timer {
      font-size: 36px;
      color: #ffd166;
    }
    .overlay-screen {
      position: absolute;
      inset: 0;
      background: rgba(12, 12, 22, 0.92);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    h1 { margin-bottom: 8px; color: #ffd166; font-size: 36px; }
    .card-grid {
      display: flex;
      gap: 20px;
      margin: 25px 0;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 900px;
    }
    .card {
      background: #2b2d42;
      border: 2px solid #8d99ae;
      border-radius: 10px;
      padding: 20px;
      width: 190px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s, opacity 0.15s;
    }
    .card:hover:not(.disabled) {
      transform: translateY(-6px);
      border-color: #06d6a0;
    }
    .card.disabled {
      opacity: 0.45;
      cursor: not-allowed;
      border-color: #555;
    }
    .card h3 { margin: 0 0 10px 0; color: #06d6a0; font-size: 20px; }
    .card p { font-size: 14px; color: #edf2f4; line-height: 1.4; }
    .cost { font-weight: bold; color: #ffd166; margin-top: 12px; font-size: 16px; }
    button {
      padding: 14px 32px;
      font-size: 18px;
      font-weight: bold;
      background: #06d6a0;
      color: #161625;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #05b384; }
  </style>
</head>
<body>

  <div id="hud">
    <div>
      <div>HP: <span id="hp-text">100/100</span></div>
      <div class="bar-container"><div id="hp-bar"></div></div>

      <div>LEVEL <span id="lvl-text" style="color:#4cc9f0;">1</span> (<span id="xp-text">0/25</span> XP)</div>
      <div class="bar-container"><div id="xp-bar"></div></div>

      <div style="color: #06d6a0;">Materials: <span id="mat-text">0</span></div>
    </div>

    <div style="text-align: center;">
      <div>WAVE <span id="wave-num">1</span></div>
      <div id="wave-timer">25</div>
    </div>

    <div style="text-align: right;">
      <div>Weapons: <span id="weapon-count">1</span>/6</div>
      <div>Enemies Alive: <span id="enemy-count" style="color:#e63946;">0</span></div>
      <div>Total Kills: <span id="kill-count">0</span></div>
    </div>
  </div>

  <!-- LEVEL UP SCREEN -->
  <div id="levelup-screen" class="overlay-screen">
    <h1 style="color: #4cc9f0;">LEVEL UP!</h1>
    <p>Choose a minor stat boost:</p>
    <div class="card-grid" id="levelup-choices"></div>
  </div>

  <!-- END OF WAVE SHOP -->
  <div id="shop-screen" class="overlay-screen">
    <h1>WAVE COMPLETE!</h1>
    <p>Materials Available: <span id="shop-mat" style="color:#06d6a0; font-weight:bold;">0</span></p>
    <div class="card-grid" id="shop-items"></div>
    <button id="next-wave-btn">START WAVE <span id="next-wave-num">2</span></button>
  </div>

  <!-- GAME OVER -->
  <div id="gameover-screen" class="overlay-screen">
    <h1 style="color: #e63946;">YOU GOT MASHED!</h1>
    <p id="final-stats" style="font-size: 22px; margin-bottom: 24px;"></p>
    <button onclick="location.reload()">PLAY AGAIN</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const state = {
      hp: 100,
      maxHp: 100,
      hpRegen: 0.4,
      speed: 0.24,
      damage: 16,
      fireRate: 0.42,
      pickupRange: 6.5,
      weapons: 1,
      level: 1,
      xp: 0,
      xpToNext: 25,
      materials: 0,
      kills: 0,
      wave: 1,
      timeLeft: 25,
      paused: false,
      gameOver: false,
      lastShot: 0
    };

    const ARENA_SIZE = 34;
    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x161625);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 36, 28);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
    dirLight.position.set(20, 40, 25);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(ARENA_SIZE * 2, ARENA_SIZE * 2),
      new THREE.MeshStandardMaterial({ color: 0x252538 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    scene.add(new THREE.GridHelper(ARENA_SIZE * 2, 34, 0x444466, 0x303048));

    const playerGroup = new THREE.Group();
    const potatoGeo = new THREE.SphereGeometry(1.1, 16, 16);
    potatoGeo.scale(1, 1.35, 0.95);
    const potatoMesh = new THREE.Mesh(potatoGeo, new THREE.MeshStandardMaterial({ color: 0xd4a373, roughness: 0.8 }));
    potatoMesh.position.y = 1.3;
    potatoMesh.castShadow = true;
    playerGroup.add(potatoMesh);

    const eyeGeo = new THREE.SphereGeometry(0.18, 8, 8);
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
    const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
    leftEye.position.set(-0.35, 1.6, 0.9);
    const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
    rightEye.position.set(0.35, 1.6, 0.9);
    playerGroup.add(leftEye, rightEye);
    scene.add(playerGroup);

    const weaponMeshes = [];
    function updateWeaponVisuals() {
      weaponMeshes.forEach(w => playerGroup.remove(w));
      weaponMeshes.length = 0;
      const geo = new THREE.BoxGeometry(0.35, 0.35, 1.15);
      const mat = new THREE.MeshStandardMaterial({ color: 0xadb5bd, metalness: 0.7 });
      for (let i = 0; i < state.weapons; i++) {
        const angle = (i / state.weapons) * Math.PI * 2;
        const w = new THREE.Mesh(geo, mat);
        w.position.set(Math.cos(angle) * 2.2, 1.3, Math.sin(angle) * 2.2);
        w.rotation.y = -angle;
        playerGroup.add(w);
        weaponMeshes.push(w);
      }
      document.getElementById('weapon-count').innerText = state.weapons;
    }
    updateWeaponVisuals();

    // NERFED LEVEL UP POOL (Small incremental gains)
    const levelUpPool = [
      {
        title: "Sharpened Peel",
        desc: "+1 Damage",
        apply: () => { state.damage += 1; }
      },
      {
        title: "Thick Skin",
        desc: "+4 Max HP",
        apply: () => { state.maxHp += 4; state.hp = Math.min(state.maxHp, state.hp + 4); }
      },
      {
        title: "Quick Trigger",
        desc: "+2% Attack Speed",
        apply: () => { state.fireRate = Math.max(0.12, state.fireRate * 0.98); }
      },
      {
        title: "Light Steps",
        desc: "+5% Move Speed",
        apply: () => { state.speed += 0.012; }
      },
      {
        title: "Starch Patch",
        desc: "+0.15 HP/s Regen",
        apply: () => { state.hpRegen += 0.15; }
      },
      {
        title: "Static Pull",
        desc: "+0.4 Pickup Range",
        apply: () => { state.pickupRange += 0.4; }
      }
    ];

    function triggerLevelUp() {
      state.paused = true;
      const screen = document.getElementById('levelup-screen');
      const container = document.getElementById('levelup-choices');
      container.innerHTML = '';

      const shuffled = [...levelUpPool].sort(() => 0.5 - Math.random()).slice(0, 3);
      shuffled.forEach(opt => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<h3>${opt.title}</h3><p>${opt.desc}</p>`;
        card.onclick = () => {
          opt.apply();
          updateHUD();
          screen.style.display = 'none';
          state.paused = false;
          lastTime = performance.now();
          requestAnimationFrame(animate);
        };
        container.appendChild(card);
      });

      screen.style.display = 'flex';
    }

    // EXPENSIVE SHOP ITEMS (High starting prices & steep 1.5x inflation)
    const shopCatalog = [
      {
        id: 'weapon',
        title: "Extra Spud Blaster",
        desc: "Add +1 orbiting weapon (Max 6)",
        cost: 110,
        maxed: () => state.weapons >= 6,
        buy: () => {
          state.weapons++;
          updateWeaponVisuals();
        }
      },
      {
        id: 'dmg',
        title: "Heavy Barrel",
        desc: "+4 Damage to all weapons",
        cost: 55,
        maxed: () => false,
        buy: () => { state.damage += 4; }
      },
      {
        id: 'firerate',
        title: "Overclocked Spring",
        desc: "+10% Attack Speed",
        cost: 65,
        maxed: () => state.fireRate <= 0.12,
        buy: () => { state.fireRate = Math.max(0.12, state.fireRate * 0.90); }
      },
      {
        id: 'hp',
        title: "Reinforced Tubers",
        desc: "+20 Max HP & heal 20 HP",
        cost: 45,
        maxed: () => false,
        buy: () => {
          state.maxHp += 20;
          state.hp = Math.min(state.maxHp, state.hp + 20);
        }
      },
      {
        id: 'regen',
        title: "Root Regeneration",
        desc: "+0.8 HP/s Regeneration",
        cost: 50,
        maxed: () => false,
        buy: () => { state.hpRegen += 0.8; }
      },
      {
        id: 'heal',
        title: "Emergency Mash",
        desc: "Restore 35 HP immediately",
        cost: 40,
        maxed: () => state.hp >= state.maxHp,
        buy: () => { state.hp = Math.min(state.maxHp, state.hp + 35); }
      }
    ];

    function renderShop() {
      document.getElementById('shop-mat').innerText = state.materials;
      const container = document.getElementById('shop-items');
      container.innerHTML = '';

      shopCatalog.forEach(item => {
        const isMaxed = item.maxed();
        const canAfford = state.materials >= item.cost && !isMaxed;

        const card = document.createElement('div');
        card.className = 'card' + (canAfford ? '' : ' disabled');
        card.innerHTML = `
          <h3>${item.title}</h3>
          <p>${item.desc}</p>
          <div class="cost">${isMaxed ? 'MAXED' : `Cost: ${item.cost} Materials`}</div>
        `;

        if (canAfford) {
          card.onclick = () => {
            state.materials -= item.cost;
            item.buy();
            item.cost = Math.ceil(item.cost * 1.5);
            updateHUD();
            renderShop();
          };
        }
        container.appendChild(card);
      });
    }

    function openShop() {
      state.paused = true;
      enemies.forEach(e => scene.remove(e.mesh));
      enemies.length = 0;
      bullets.forEach(b => scene.remove(b.mesh));
      bullets.length = 0;
      enemyBullets.forEach(eb => scene.remove(eb.mesh));
      enemyBullets.length = 0;

      document.getElementById('next-wave-num').innerText = state.wave + 1;
      renderShop();
      document.getElementById('shop-screen').style.display = 'flex';
    }

    document.getElementById('next-wave-btn').onclick = () => {
      state.wave++;
      state.timeLeft = 25 + Math.min(15, state.wave * 2);
      document.getElementById('shop-screen').style.display = 'none';
      state.paused = false;
      updateHUD();
      lastTime = performance.now();
      requestAnimationFrame(animate);
    };

    const enemies = [];
    const bullets = [];
    const enemyBullets = [];
    const gems = [];

    const geoSwarmer = new THREE.BoxGeometry(1.2, 1.2, 1.2);
    const matSwarmer = new THREE.MeshStandardMaterial({ color: 0xe63946 });

    const geoFast = new THREE.ConeGeometry(0.7, 1.4, 6);
    const matFast = new THREE.MeshStandardMaterial({ color: 0xf77f00 });

    const geoTank = new THREE.BoxGeometry(2.3, 2.3, 2.3);
    const matTank = new THREE.MeshStandardMaterial({ color: 0x9b5de5 });

    const geoRanged = new THREE.OctahedronGeometry(0.95);
    const matRanged = new THREE.MeshStandardMaterial({ color: 0x00bbf9 });

    const bulletGeo = new THREE.SphereGeometry(0.28, 8, 8);
    const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffd166 });
    const enemyBulletMat = new THREE.MeshBasicMaterial({ color: 0xff006e });
    const gemGeo = new THREE.OctahedronGeometry(0.45);
    const gemMat = new THREE.MeshStandardMaterial({ color: 0x06d6a0, emissive: 0x035e46 });

    function spawnHordeCluster() {
      const clusterSize = Math.min(8, 2 + Math.floor(state.wave * 0.8));
      const side = Math.floor(Math.random() * 4);
      const bound = ARENA_SIZE - 1.5;

      let baseX = 0, baseZ = 0;
      if (side === 0) { baseX = (Math.random() - 0.5) * bound * 2; baseZ = -bound; }
      else if (side === 1) { baseX = (Math.random() - 0.5) * bound * 2; baseZ = bound; }
      else if (side === 2) { baseX = -bound; baseZ = (Math.random() - 0.5) * bound * 2; }
      else { baseX = bound; baseZ = (Math.random() - 0.5) * bound * 2; }

      for (let i = 0; i < clusterSize; i++) {
        const roll = Math.random();
        let type = 'swarmer', geo = geoSwarmer, mat = matSwarmer;
        let hp = 18 + state.wave * 5, speed = 0.085, damage = 8, radius = 0.85, yPos = 0.7, val = 1;

        if (state.wave >= 2 && roll < 0.25) {
          type = 'fast'; geo = geoFast; mat = matFast;
          hp = 12 + state.wave * 3; speed = 0.145; damage = 6; radius = 0.7; yPos = 0.8; val = 1;
        } else if (state.wave >= 3 && roll < 0.42) {
          type = 'ranged'; geo = geoRanged; mat = matRanged;
          hp = 22 + state.wave * 5; speed = 0.065; damage = 8; radius = 0.95; yPos = 1.1; val = 2;
        } else if (state.wave >= 4 && roll < 0.55) {
          type = 'tank'; geo = geoTank; mat = matTank;
          hp = 70 + state.wave * 18; speed = 0.048; damage = 15; radius = 1.4; yPos = 1.25; val = 3;
        }

        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(
          Math.max(-bound, Math.min(bound, baseX + (Math.random() - 0.5) * 4)),
          yPos,
          Math.max(-bound, Math.min(bound, baseZ + (Math.random() - 0.5) * 4))
        );
        mesh.castShadow = true;
        scene.add(mesh);
        enemies.push({ mesh, type, hp, speed, damage, radius, val, shootTimer: Math.random() * 1.5 });
      }
    }

    function shootPlayerWeapons() {
      if (enemies.length === 0) return;
      weaponMeshes.forEach(w => {
        const wPos = new THREE.Vector3();
        w.getWorldPosition(wPos);

        let nearest = null, minDist = 26;
        for (let i = 0; i < enemies.length; i++) {
          const d = wPos.distanceTo(enemies[i].mesh.position);
          if (d < minDist) {
            minDist = d;
            nearest = enemies[i];
          }
        }

        if (nearest) {
          const dir = new THREE.Vector3().subVectors(nearest.mesh.position, wPos).setY(0).normalize();
          const b = new THREE.Mesh(bulletGeo, bulletMat);
          b.position.copy(wPos);
          scene.add(b);
          bullets.push({ mesh: b, dir, life: 1.4 });
        }
      });
    }

    function shootEnemyBullet(fromPos, targetPos) {
      const dir = new THREE.Vector3().subVectors(targetPos, fromPos).setY(0).normalize();
      const b = new THREE.Mesh(bulletGeo, enemyBulletMat);
      b.position.copy(fromPos);
      b.position.y = 1.1;
      scene.add(b);
      enemyBullets.push({ mesh: b, dir, life: 2.5 });
    }

    function spawnGem(pos, val) {
      const g = new THREE.Mesh(gemGeo, gemMat);
      g.position.set(pos.x, 0.7, pos.z);
      scene.add(g);
      gems.push({ mesh: g, val });
    }

    function updateHUD() {
      document.getElementById('hp-text').innerText = `${Math.ceil(state.hp)}/${state.maxHp}`;
      document.getElementById('hp-bar').style.width = `${Math.max(0, (state.hp / state.maxHp) * 100)}%`;
      document.getElementById('lvl-text').innerText = state.level;
      document.getElementById('xp-text').innerText = `${state.xp}/${state.xpToNext}`;
      document.getElementById('xp-bar').style.width = `${Math.min(100, (state.xp / state.xpToNext) * 100)}%`;
      document.getElementById('mat-text').innerText = state.materials;
      document.getElementById('wave-num').innerText = state.wave;
      document.getElementById('wave-timer').innerText = Math.ceil(state.timeLeft);
      document.getElementById('enemy-count').innerText = enemies.length;
      document.getElementById('kill-count').innerText = state.kills;
    }

    let lastTime = performance.now();
    let spawnTimer = 0;

    function animate(now) {
      if (state.gameOver || state.paused) return;
      requestAnimationFrame(animate);

      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;

      state.timeLeft -= dt;
      if (state.timeLeft <= 0) {
        state.timeLeft = 0;
        updateHUD();
        openShop();
        return;
      }

      if (state.hp < state.maxHp) {
        state.hp = Math.min(state.maxHp, state.hp + state.hpRegen * dt);
      }

      let moveX = 0, moveZ = 0;
      if (keys['KeyW'] || keys['ArrowUp']) moveZ -= 1;
      if (keys['KeyS'] || keys['ArrowDown']) moveZ += 1;
      if (keys['KeyA'] || keys['ArrowLeft']) moveX -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;

      if (moveX !== 0 || moveZ !== 0) {
        const len = Math.hypot(moveX, moveZ);
        moveX /= len;
        moveZ /= len;
        playerGroup.position.x = Math.max(-ARENA_SIZE + 1.5, Math.min(ARENA_SIZE - 1.5, playerGroup.position.x + moveX * state.speed));
        playerGroup.position.z = Math.max(-ARENA_SIZE + 1.5, Math.min(ARENA_SIZE - 1.5, playerGroup.position.z + moveZ * state.speed));
        playerGroup.rotation.y = Math.atan2(moveX, moveZ);
      }

      camera.position.x += (playerGroup.position.x - camera.position.x) * 0.1;
      camera.position.z += (playerGroup.position.z + 28 - camera.position.z) * 0.1;
      camera.lookAt(playerGroup.position.x, 0, playerGroup.position.z);

      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnHordeCluster();
        spawnTimer = Math.max(0.8, 2.6 - state.wave * 0.18);
      }

      if (now / 1000 - state.lastShot >= state.fireRate) {
        shootPlayerWeapons();
        state.lastShot = now / 1000;
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.mesh.position.addScaledVector(b.dir, 0.65);
        b.life -= dt;

        let hit = false;
        for (let j = enemies.length - 1; j >= 0; j--) {
          const e = enemies[j];
          if (b.mesh.position.distanceTo(e.mesh.position) < e.radius + 0.35) {
            e.hp -= state.damage;
            hit = true;
            if (e.hp <= 0) {
              spawnGem(e.mesh.position, e.val);
              scene.remove(e.mesh);
              enemies.splice(j, 1);
              state.kills++;
            }
            break;
          }
        }

        if (hit || b.life <= 0) {
          scene.remove(b.mesh);
          bullets.splice(i, 1);
        }
      }

      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        eb.mesh.position.addScaledVector(eb.dir, 0.28);
        eb.life -= dt;

        if (eb.mesh.position.distanceTo(playerGroup.position) < 1.2) {
          state.hp -= 12;
          scene.remove(eb.mesh);
          enemyBullets.splice(i, 1);
          checkGameOver();
          continue;
        }

        if (eb.life <= 0) {
          scene.remove(eb.mesh);
          enemyBullets.splice(i, 1);
        }
      }

      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const distToPlayer = e.mesh.position.distanceTo(playerGroup.position);

        if (e.type === 'ranged' && distToPlayer < 15) {
          e.shootTimer += dt;
          if (e.shootTimer >= 2.2) {
            e.shootTimer = 0;
            shootEnemyBullet(e.mesh.position, playerGroup.position);
          }
        } else {
          const dir = new THREE.Vector3().subVectors(playerGroup.position, e.mesh.position).setY(0).normalize();
          e.mesh.position.addScaledVector(dir, e.speed);
        }

        for (let j = i - 1; j >= Math.max(0, i - 12); j--) {
          const other = enemies[j];
          const dx = e.mesh.position.x - other.mesh.position.x;
          const dz = e.mesh.position.z - other.mesh.position.z;
          const dSq = dx * dx + dz * dz;
          const minSep = e.radius + other.radius;
          if (dSq > 0.001 && dSq < minSep * minSep) {
            const push = 0.04;
            e.mesh.position.x += dx * push;
            e.mesh.position.z += dz * push;
          }
        }

        if (distToPlayer < e.radius + 1.0) {
          state.hp -= e.damage * dt * 2.2;
          checkGameOver();
        }
      }

      for (let i = gems.length - 1; i >= 0; i--) {
        const g = gems[i];
        g.mesh.rotation.y += 0.06;
        const dist = g.mesh.position.distanceTo(playerGroup.position);

        if (dist < state.pickupRange) {
          const pull = new THREE.Vector3().subVectors(playerGroup.position, g.mesh.position).setY(0).normalize();
          g.mesh.position.addScaledVector(pull, 0.34);
        }

        if (dist < 1.5) {
          state.materials += g.val;
          state.xp += g.val;
          scene.remove(g.mesh);
          gems.splice(i, 1);

          if (state.xp >= state.xpToNext) {
            state.xp -= state.xpToNext;
            state.level++;
            state.xpToNext = Math.floor(state.xpToNext * 1.45);
            updateHUD();
            triggerLevelUp();
            return;
          }
        }
      }

      updateHUD();
      renderer.render(scene, camera);
    }

    function checkGameOver() {
      if (state.hp <= 0 && !state.gameOver) {
        state.hp = 0;
        state.gameOver = true;
        updateHUD();
        document.getElementById('gameover-screen').style.display = 'flex';
        document.getElementById('final-stats').innerText = `Level ${state.level} | Wave ${state.wave} | Total Kills: ${state.kills}`;
      }
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    updateHUD();
    animate(performance.now());
  </script>
</body>
</html>
